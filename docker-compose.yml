services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password_dev_123}"
      DB_NAME: "${DB_NAME:-fintrackbd}"
      DB_USER: "${DB_USER:-fintrack_user}"
      DB_PASSWORD: "${DB_PASSWORD:-fintrack_password_dev_123}"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init-user.sh:/docker-entrypoint-initdb.d/init-user.sh:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password_dev_123}"
    volumes:
      - ./backend:/app
      - ./mysql/grant-privileges.sql:/etc/mysql-security/grant-privileges.sql:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo '==> Oczekiwanie na gotowość bazy danych MySQL...' &&
        until nc -z db 3306; do sleep 1; done &&
        echo '==> [DDL / Root] Wykonywanie migracji schematu...' &&
        DB_USER=root DB_PASSWORD="${MYSQL_ROOT_PASSWORD:-root_password_dev_123}" python manage.py migrate --no-input &&
        echo '==> [DDL / Root] Ładowanie danych początkowych (fixtures)...' &&
        DB_USER=root DB_PASSWORD="${MYSQL_ROOT_PASSWORD:-root_password_dev_123}" python manage.py loaddata initial_data.json &&
        echo '==> [Security] Aplikowanie Table-Level Least Privilege dla fintrack_user...' &&
        mysql -h db -u root -p"${MYSQL_ROOT_PASSWORD:-root_password_dev_123}" --skip-ssl fintrackbd < /etc/mysql-security/grant-privileges.sql &&
        echo '==> [Runtime] Uruchamianie serwera Gunicorn (jako fintrack_user)...' &&
        gunicorn myproject.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --access-logformat '%(t)s "%(r)s" %(s)s %(b)s in %(L)s'

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
